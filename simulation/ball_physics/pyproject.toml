[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "pingpong-ball-physics"
version = "0.1.0"
description = "Batched table-tennis flight and contact physics"
requires-python = ">=3.10,<3.12"
dependencies = ["torch>=2.2,<3", "PyYAML>=6,<7"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pingpong_physics = ["domain_randomization.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
