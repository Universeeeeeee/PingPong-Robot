[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "g1-spin"
version = "0.1.0"
description = "Fixed-ball spherical spin estimation research demo"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26,<2", "scipy>=1.11", "matplotlib>=3.6", "opencv-python-headless>=4.8", "PyYAML>=6"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
g1-spin = "g1_spin.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
